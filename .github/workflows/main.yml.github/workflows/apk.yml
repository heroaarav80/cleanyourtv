name: Build TV Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"

      - name: Check project files
        run: |
          test -f AndroidManifest.xml
          test -f build.sh
          test -f src/com/tvhome/launcher/MainActivity.java
          echo "All required launcher files were found."

      - name: Build APK
        run: |
          bash build.sh

      - name: Verify APK
        run: |
          test -f build/tvhome-signed.apk
          ls -lh build/tvhome-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-apk
          path: build/tvhome-signed.apk
          if-no-files-found: error
          retention-days: 7
