name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TV Launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK was not found."
            exit 1
          fi
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          else
            echo "sdkmanager was not found."
            find "$SDK" -name sdkmanager -type f
            exit 1
          fi

      - name: Locate project files
        run: |
          # If the project is not in the repo root, try unzipping the zip files
          if [ ! -f AndroidManifest.xml ]; then
            for z in tv-launcher-apk-ready.zip "tv-launcher (1).zip"; do
              if [ -f "$z" ]; then
                echo "Unzipping $z"
                unzip -o -q "$z" -d unzipped_project
              fi
            done
          fi

          MANIFEST=$(find . -maxdepth 4 -name AndroidManifest.xml \
            -not -path "./.git/*" -not -path "./examples/*" \
            -not -path "./addons/*" | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found anywhere in the repo."
            ls -R . | head -100
            exit 1
          fi

          DIR=$(dirname "$MANIFEST")
          echo "Project found in: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          cd "$DIR"
          ls -la
          test -f AndroidManifest.xml
          test -f build.sh
          test -f src/com/tvhome/launcher/MainActivity.java

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f build/tvhome-signed.apk
          ls -lh build/tvhome-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-apk
          path: ${{ env.PROJECT_DIR }}/build/tvhome-signed.apk
          if-no-files-found: error
          retention-days: 7
