name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TV Launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "Checking Android SDK..."
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK was not found."
            exit 1
          fi

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          else
            echo "sdkmanager was not found in the expected location."
            find "$SDK" -name sdkmanager -type f
            exit 1
          fi

      - name: Check project files
        run: |
          ls -la
          test -f AndroidManifest.xml
          test -f build.sh
          test -f src/com/tvhome/launcher/MainActivity.java

      - name: Build APK
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Verify APK
        run: |
          test -f build/tvhome-signed.apk
          ls -lh build/tvhome-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-apk
          path: build/tvhome-signed.apk
          if-no-files-found: error
          retention-days: 7
