name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TV Launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_JAR=$SDK/platforms/android-35/android.jar" >> "$GITHUB_ENV"

      - name: Locate project files
        run: |
          if [ ! -f AndroidManifest.xml ]; then
            for z in tv-launcher-apk-ready.zip "tv-launcher (1).zip"; do
              if [ -f "$z" ]; then
                unzip -o -q "$z" -d unzipped_project
              fi
            done
          fi

          MANIFEST=$(find . -maxdepth 4 -name AndroidManifest.xml \
            -not -path "./.git/*" -not -path "./examples/*" \
            -not -path "./addons/*" | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found."
            ls -R . | head -100
            exit 1
          fi

          DIR=$(dirname "$MANIFEST")
          echo "Project found in: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          ls -la "$DIR"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ls -lh build/tvhome-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-apk
          path: ${{ env.PROJECT_DIR }}/build/tvhome-signed.apk
          if-no-files-found: error
          retention-days: 7
